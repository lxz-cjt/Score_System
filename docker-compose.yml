# 一键启动 MySQL 8：docker compose up -d
# 然后使用 mysql 环境启动后端：mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
services:
  mysql:
    image: mysql:8.0
    container_name: score-system-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: score_system
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123456" ]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
