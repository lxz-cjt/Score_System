spring:
  application:
    name: score-system
  profiles:
    # 默认使用 dev（H2 内存库，开箱即用）；切换 MySQL 使用 mysql 环境
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    io.github.lxzcjt.scoresystem: info
