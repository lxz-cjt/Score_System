# 本地开发环境：H2 内存数据库，无需安装任何数据库即可一键启动
# 启动后自动执行 Flyway 建表与示例数据脚本
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:score_system;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  h2:
    console:
      # H2 控制台：http://localhost:8080/h2-console
      enabled: true
      path: /h2-console
